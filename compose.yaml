services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tu_basket_booking
      MYSQL_USER: booking_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    ports:
      - "${MYSQL_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      AUTO_SEED: ${AUTO_SEED:-false}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: tu_basket_booking
      DB_USER: booking_user
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      QR_HMAC_SECRET: ${QR_HMAC_SECRET:?Set QR_HMAC_SECRET in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      SESSION_TIMEOUT_MINUTES: ${SESSION_TIMEOUT_MINUTES:-60}
      TU_API_APPLICATION_KEY: ${TU_API_APPLICATION_KEY:-}
      TU_API_TIMEOUT_SECONDS: ${TU_API_TIMEOUT_SECONDS:-10}
      STUDENT_REGISTRY_PROVIDER: ${STUDENT_REGISTRY_PROVIDER:-unconfigured}
      STUDENT_REGISTRY_MOCK_DATA: "${STUDENT_REGISTRY_MOCK_DATA:-}"
      CHECKIN_WINDOW_MINUTES: ${CHECKIN_WINDOW_MINUTES:-15}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/html/index.html"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database admin tool, not part of the app; start it with:
  #   docker compose --profile tools up -d phpmyadmin
  phpmyadmin:
    image: phpmyadmin:latest
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
