# Frontend container: serves the pages and passes API calls to the backend container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Redirects keep the port the browser used (e.g. 3000), not nginx's own port 80.
    absolute_redirect off;

    # Docker's DNS, so a recreated backend container is found at its new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location = / {
        return 302 /html/index.html;
    }

    location / {
        try_files $uri =404;
        # Browsers check for a newer file on every visit (a cheap 304 when unchanged),
        # so a rebuilt frontend never runs alongside old cached JS or CSS.
        add_header Cache-Control "no-cache" always;
    }

    # The pages call /api on this same origin, so the login session cookie is sent
    # with every call without any cross-origin setup.
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API documentation, also reachable from the frontend port.
    location ~ ^/(docs|openapi\.json)$ {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }
}
