<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TU BASKET BOOKING</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header / Navigation -->
  <header class="navbar">
    <div class="logo">
      <i class="fa-solid fa-basketball logo-icon"></i>
      <span class="logo-text">TU BASKET BOOKING</span>
    </div>
    <button class="btn-officer">เจ้าหน้าที่ประจำสนาม</button>
  </header>

  <!-- Main Container -->
  <main class="container">
    <div class="page-title">
      <span class="subtitle text-orange">สแกน QR Code แล้ว</span>
      <h1>ยืนยันการเช็คอิน</h1>
    </div>
    <div class="grid-layout">
      <!-- Cards will be added here -->
        <section class="card booking-card">
        <div class="card-header">
            <div class="booking-id-group">
            <span class="label">รหัสจอง</span>
            <h2 class="booking-id" id="bookingId">#TU-69101601</h2>
            </div>
            <span class="badge badge-warning" id="statusBadge">
            <i class="fa-regular fa-clock"></i> รอเช็คอิน
            </span>
        </div>

        <div class="user-info-box">
            <div class="avatar-icon"><i class="fa-regular fa-user"></i></div>
            <div class="user-details">
            <p class="user-name">[ชื่อ-นามสกุลผู้จอง]</p>
            <p class="user-id">รหัสนักศึกษา [รหัสนักศึกษา]</p>
            </div>
        </div>

        <div class="info-grid">
            <div class="info-item">
            <span class="info-label">สนาม</span>
            <span class="info-value">สนามบาสเกตบอล สนามที่ 1</span>
            </div>
            <div class="info-item">
            <span class="info-label">วันที่</span>
            <span class="info-value">วันศุกร์ 16 ต.ค. 2569</span>
            </div>
            <div class="info-item">
            <span class="info-label">เวลา</span>
            <span class="info-value">18:00 – 19:00 (1 ชม.)</span>
            </div>
            <div class="info-item full-width">
            <span class="info-label">สถานที่</span>
            <span class="info-value">คณะวิทยาศาสตร์และเทคโนโลยี ศูนย์รังสิต</span>
            </div>
        </div>
        </section>
    </div>
  </main>
</body>
