<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TU BASKET BOOKING</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <main class="container">
    <div class="page-title">
        <span class="subtitle text-danger">สแกน QR Code แล้ว</span>
        <h1>ยืนยันการเช็คอิน</h1>
    </div>

    <div class="grid-layout">
        <!-- Left: Booking Card (Badge Danger) -->
        <section class="card booking-card">
        <div class="card-header">
            <div class="booking-id-group">
            <span class="label">รหัสจอง</span>
            <h2 class="booking-id">#TU-69101401</h2>
            </div>
            <span class="badge badge-danger"><i class="fa-solid fa-xmark"></i> ยกเลิกแล้ว</span>
        </div>
        <!-- User info & info grid -->
        </section>

        <!-- Right: Failed Result Card -->
        <section class="card result-card align-center">
        <div class="status-icon icon-danger"><i class="fa-solid fa-xmark"></i></div>
        <h2 class="result-title text-danger">เช็คอินไม่ได้</h2>
        <p class="result-subtitle">การจองนี้ถูกยกเลิกแล้ว</p>
        <div class="cancel-reason-box">
            <span>ยกเลิกก่อน 3 ชม. • คืนโควตาประจำวันเรียบร้อยแล้ว</span>
        </div>
        <button type="button" class="btn btn-dark" onclick="window.location.href='check-in-approval.html'">
            <i class="fa-solid fa-expand"></i> สแกนรายการถัดไป
        </button>
        </section>
    </div>
    </main>
</body>
</html>
