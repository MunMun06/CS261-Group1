<!doctype html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ประวัติการจอง - TU Basket Booking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="../css/history.css">
    <script src="../js/history.js" defer></script>
</head>

<body>
    <header class="site-header">
        <div class="site-header-inner">
            <a class="brand" href="index.html" aria-label="TU Basket Booking - หน้าแรก">
                <span class="brand-mark" aria-hidden="true">
                    <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
                        <circle cx="11" cy="11" r="8.7" stroke="currentColor" stroke-width="1.65" />
                        <path d="M2.3 11h17.4M11 2.3v17.4M4.9 4.9c2.4 2.2 2.4 10 0 12.2M17.1 4.9c-2.4 2.2-2.4 10 0 12.2"
                            stroke="currentColor" stroke-width="1.65" stroke-linecap="round" />
                    </svg>
                </span>
                <span class="brand-name">TU BASKET BOOKING</span>
            </a>

            <nav class="site-nav" aria-label="เมนูหลัก">
                <a class="nav-link" href="index.html">จองสนาม</a>
                <a class="nav-link is-active" href="history.html" aria-current="page">ประวัติการจอง</a>
            </nav>
        </div>
    </header>

    <main class="history-page">
        <div class="page-header">
            <h1 class="page-title">ประวัติการจอง</h1>
            <p class="page-summary" id="history-summary"></p>
        </div>

        <div class="booking-list" id="history-list"></div>
        <p class="history-empty" id="history-empty" hidden>ยังไม่มีรายการจอง</p>

        <nav class="pagination" id="pagination" aria-label="เปลี่ยนหน้า">
            <span class="pagination-text" id="pagination-range"></span>
            <div class="pagination-pages" id="pagination-pages"></div>
            <span class="pagination-text" id="pagination-page"></span>
        </nav>
    </main>

    <dialog class="qr-dialog" id="qr-dialog" aria-labelledby="qr-dialog-title">
        <h2 class="qr-dialog-title" id="qr-dialog-title">QR Code สำหรับเช็คอิน</h2>
        <div class="qr-placeholder" aria-hidden="true">QR</div>
        <p class="qr-dialog-code" id="qr-dialog-code"></p>
        <p class="qr-dialog-hint">แสดง QR Code นี้ที่ประตูสนามเพื่อเช็คอิน</p>
        <form method="dialog">
            <button class="button-secondary" type="submit">ปิด</button>
        </form>
    </dialog>

    <template id="booking-card-template">
        <article class="booking-card">
            <div class="booking-main">
                <h2 class="booking-court"></h2>
                <div class="booking-when">
                    <svg class="icon icon-calendar" width="16" height="16" viewBox="0 0 16 16" fill="none"
                        aria-hidden="true">
                        <rect x="2" y="2.7" width="12" height="12" rx="1.3" stroke="currentColor" stroke-width="1.33" />
                        <path d="M10.7 1.3V4M5.3 1.3V4M2 6.7h12" stroke="currentColor" stroke-width="1.33" />
                    </svg>
                    <span class="booking-date"></span>
                    <span class="divider" aria-hidden="true"></span>
                    <span class="booking-time"></span>
                </div>
                <div class="booking-location">
                    <svg class="icon icon-pin" width="16" height="16" viewBox="0 0 16 16" fill="none"
                        aria-hidden="true">
                        <path d="M14 6.7c0 4.6-6 8.6-6 8.6s-6-4-6-8.6a6 6 0 0 1 12 0Z" stroke="currentColor"
                            stroke-width="1.33" />
                        <circle cx="8" cy="6.7" r="2" stroke="currentColor" stroke-width="1.33" />
                    </svg>
                    <span class="booking-place"></span>
                </div>
            </div>
            <div class="booking-detail">
                <span class="detail-label"></span>
                <span class="detail-value"></span>
            </div>
            <div class="booking-side">
                <span class="status-badge"></span>
            </div>
        </article>
    </template>

    <template id="status-icons-template">
        <svg data-status="pending" width="13" height="13" viewBox="0 0 12 12" fill="none" aria-hidden="true">
            <circle cx="6" cy="6" r="5" stroke="currentColor" stroke-width="1.25" />
            <path d="M6 3v3l2 1" stroke="currentColor" stroke-width="1.25" />
        </svg>
        <svg data-status="checked-in" width="13" height="13" viewBox="0 0 12 12" fill="none" aria-hidden="true">
            <path d="M10 3.5 4.5 9 2 6.5" stroke="currentColor" stroke-width="1.4" />
        </svg>
        <svg data-status="cancelled" width="13" height="13" viewBox="0 0 12 12" fill="none" aria-hidden="true">
            <path d="M9 3 3 9M3 3l6 6" stroke="currentColor" stroke-width="1.4" />
        </svg>
    </template>

    <template id="qr-button-template">
        <button class="button-primary qr-button" type="button">
            <svg width="16" height="16" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <path d="M1.5 1.5h4v4h-4zM8 1.5h4v4H8zM8 8h4v4H8zM1.5 8h4v4h-4z" stroke="currentColor"
                    stroke-width="1.4" />
            </svg>
            แสดง QR Code
        </button>
    </template>
</body>

</html>
