<!doctype html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ประวัติการจอง - TU Basket Booking</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/history.css">
    <script src="../js/history.js" defer></script>
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar">
            <a class="sidebar-logo" href="index.html" aria-label="TU Basket Booking - หน้าแรก">
                <span class="sidebar-logo-mark" aria-hidden="true">TU</span>
                <span class="sidebar-logo-name">TU BASKET<br>BOOKING</span>
            </a>

            <section class="profile-card" aria-label="โปรไฟล์ผู้ใช้">
                <div class="profile-avatar" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" fill="currentColor" />
                        <path d="M4.5 21a7.5 7.5 0 0 1 15 0" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" />
                    </svg>
                </div>
                <h2 class="profile-role">TU Member</h2>
                <p class="profile-detail" id="user-fullname">ชื่อ-นามสกุล</p>
                <p class="profile-detail" id="user-faculty">คณะ</p>
                <p class="profile-detail" id="user-email">อีเมล</p>
            </section>

            <nav class="sidebar-menu" aria-label="เมนูหลัก">
                <a class="menu-button" href="index.html">
                    <span class="menu-icon" aria-hidden="true">⌂</span>
                    <span>หน้าแรกจองสนาม</span>
                </a>
                <a class="menu-button is-active" href="history.html" aria-current="page">
                    <span class="menu-icon" aria-hidden="true">◷</span>
                    <span>ประวัติการจอง</span>
                </a>
                <button class="menu-button" type="button">
                    <span class="menu-icon" aria-hidden="true">⇥</span>
                    <span>ออกจากระบบ</span>
                </button>
            </nav>
        </aside>

        <main class="main-content history-page">
            <header class="page-header">
                <h1 class="page-title">ประวัติการจอง</h1>
                <p class="page-subtitle">รายการจองสนามบาสเกตบอลทั้งหมดของคุณ</p>
            </header>

            <div class="history-filters" role="tablist" aria-label="กรองตามสถานะ">
                <button class="filter-tab is-active" type="button" role="tab" aria-selected="true"
                    data-filter="all">ทั้งหมด</button>
                <button class="filter-tab" type="button" role="tab" aria-selected="false"
                    data-filter="upcoming">กำลังจะถึง</button>
                <button class="filter-tab" type="button" role="tab" aria-selected="false"
                    data-filter="completed">เสร็จสิ้น</button>
                <button class="filter-tab" type="button" role="tab" aria-selected="false"
                    data-filter="cancelled">ยกเลิกแล้ว</button>
            </div>

            <section class="history-card" aria-label="รายการจอง">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th scope="col">รหัสการจอง</th>
                            <th scope="col">สนาม</th>
                            <th scope="col">วันที่</th>
                            <th scope="col">เวลา</th>
                            <th scope="col">สถานะ</th>
                            <th scope="col"><span class="visually-hidden">การจัดการ</span></th>
                        </tr>
                    </thead>
                    <tbody id="history-list"></tbody>
                </table>

                <p class="history-empty" id="history-empty" hidden>ไม่พบรายการจอง</p>
            </section>
        </main>
    </div>
</body>

</html>
