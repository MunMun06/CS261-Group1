<!doctype html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TU Basket Booking</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/script.js" defer></script>
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar">
            <a class="sidebar-logo" href="index.html" aria-label="TU Basket Booking - หน้าแรก">
                <span class="sidebar-logo-mark" aria-hidden="true">TU</span>
                <span class="sidebar-logo-name">TU BASKET<br>BOOKING</span>
            </a>

            <section class="profile-card" aria-label="โปรไฟล์ผู้ใช้">
                <div class="profile-avatar" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" fill="currentColor" />
                        <path d="M4.5 21a7.5 7.5 0 0 1 15 0" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" />
                    </svg>
                </div>
                <h2 class="profile-role">TU Member</h2>
                <p class="profile-detail" id="user-fullname">ชื่อ-นามสกุล</p>
                <p class="profile-detail" id="user-faculty">คณะ</p>
                <p class="profile-detail" id="user-email">อีเมล</p>
            </section>

            <nav class="sidebar-menu" aria-label="เมนูหลัก">
                <a class="menu-button is-active" href="index.html" aria-current="page">
                    <span class="menu-icon" aria-hidden="true">⌂</span>
                    <span>หน้าแรกจองสนาม</span>
                </a>
                <a class="menu-button" href="history.html">
                    <span class="menu-icon" aria-hidden="true">◷</span>
                    <span>ประวัติการจอง</span>
                </a>
                <button class="menu-button" type="button">
                    <span class="menu-icon" aria-hidden="true">⇥</span>
                    <span>ออกจากระบบ</span>
                </button>
            </nav>
        </aside>
        <main class="main-content">
            <section class="date-picker" aria-labelledby="date-heading">
                <h1 id="date-heading">เลือกวันที่</h1>
                <div id="date-list" class="date-list" role="group" aria-label="เลือกวันที่"></div>
            </section>
            <section class="booking-rules" aria-labelledby="booking-rules-heading">
                <div class="booking-rules-title">
                    <span class="booking-rules-icon" aria-hidden="true">i</span>
                    <h2 id="booking-rules-heading">กฎการจองสนาม</h2>
                </div>
                <ul>
                    <li>จองล่วงหน้าได้สูงสุด 7 วัน</li>
                    <li>จำกัด 2 ชม./วัน</li>
                    <li>ยกเลิกก่อน 1 ชม.</li>
                </ul>
            </section>
        </main>
    </div>
</body>

</html>
