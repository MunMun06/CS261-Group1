<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - TU BASKET BOOKING</title>
  <link rel="stylesheet" href="../css/login-style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="login-container">
    <!-- Left Panel -->
    <div class="left-panel">
      <div class="brand">
        <i class="fa-solid fa-basketball logo-icon"></i>
        <div class="brand-text">
          <h2>TU BASKET BOOKING</h2>
          <p>คณะวิทยาศาสตร์และเทคโนโลยี • ศูนย์รังสิต</p>
        </div>
      </div>
      
      <div class="hero-text">
        <h1>จองสนามบาส<br><span class="text-orange">ได้ในไม่กี่คลิก</span></h1>
        <ul class="features">
           <li><div class="icon-box"><i class="fa-regular fa-calendar"></i></div> เลือกวันและเวลาได้ในหน้าต่างเดียว</li>
           <li><div class="icon-box"><i class="fa-regular fa-clock"></i></div> เห็นช่วงว่างของแต่ละสนามได้ทันที</li>
           <li><div class="icon-box"><i class="fa-solid fa-qrcode"></i></div> เช็คอินด้วย QR Code ที่ประตูสนาม</li>
        </ul>
      </div>
      <div class="footer-text">TU Sports Complex @ Rangsit • เปิด 08:00 – 19:00</div>
    </div>
  </div>
  <script src="../js/login-script.js"></script>
</body>
</html>
